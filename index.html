<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to HTML Table</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #0056b3;
            color: white;
        }

        #csvFile {
            margin-bottom: 10px;
        }

        #tableContainer {
            overflow-x: auto;
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            table {
                font-size: 12px;
            }
        }

        header {
            text-align: center;
            padding: 20px;
            background-color: #0056b3;
            color: white;
            margin-bottom: 20px;
        }

        header img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>CSV to HTML Table Converter</h1>
        <img id="att-image-1760631347208">
    </header>
    <div class="container">
        <label for="csvFile">Enter CSV URL:</label>
        <input type="text" id="csvFile" placeholder="Enter CSV URL">
        <button onclick="loadCSV()">Load CSV</button>
        <div id="tableContainer"></div>
    </div>

    <script>
        function loadCSV() {
            const csvFile = document.getElementById('csvFile').value;
            fetch(csvFile)
                .then(response => response.text())
                .then(csv => {
                    const table = csvToTable(csv);
                    document.getElementById('tableContainer').innerHTML = table;
                })
                .catch(error => {
                    console.error('Error fetching CSV:', error);
                    document.getElementById('tableContainer').innerHTML = '<p>Error loading CSV data.</p>';
                });
        }

        function csvToTable(csv) {
            const lines = csv.split('\n');
            let table = '<table>';

            lines.forEach((line, index) => {
                const cells = line.split(',');
                table += '<tr>';
                cells.forEach(cell => {
                    if (index === 0) {
                        table += `<th>${cell}</th>`;
                    } else {
                        table += `<td>${cell}</td>`;
                    }
                });
                table += '</tr>';
            });

            table += '</table>';
            return table;
        }
        fetch('https://sanat-garg.github.io/calendigy-3/assets/image-1760631347208.b64').then(r=>r.text()).then(b=>{ const i=document.getElementById('att-image-1760631347208'); const mime=(('https://sanat-garg.github.io/calendigy-3/assets/image-1760631347208.b64#mime=image/png'.split('#mime=')[1])||'image/png'); if(i) i.src='data:'+mime+';base64,'+b; });
    </script>
</body>
</html>
